[workspace]
members = [
    "crates/text-buffer",
    "crates/editor-core",
    "crates/filesystem",
    "crates/syntax",
    "crates/commands",
    "crates/settings",
    "crates/workspace",
    "crates/search",
    "crates/git",
    "crates/language-server",
    "crates/debugger",
    "crates/terminal",
    "crates/extensions",
    "crates/ui",
    "crates/app",
    "benchmarks",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Oxide Team"]
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
debug = true
